# Civic Eye web: static app + /api reverse proxy. Port 80 is always on (Cloudflare "Flexible",
# local Docker). Port 443 is added by 40-enable-tls.sh when an origin certificate is mounted.

# Behind Cloudflare: keep its scheme / visitor IP; without it, use what nginx sees.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/civic-eye-locations.conf;
}
