# Shared by the :80 and :443 servers.
root /usr/share/nginx/html;
index index.html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

# API: /api/incidents → http://api:8000/incidents. Resolved at request time (Docker DNS), so nginx
# also starts when the api container is restarting.
location /api/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 90s; # AI parsing can take ~10 s; Cloudflare's own limit is 100 s
    client_max_body_size 2m;
}

# Hashed build files never change: cache them for a year.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

location = /manifest.webmanifest {
    default_type application/manifest+json;
}

# Single-page app: any other path (e.g. /incidents/123) loads index.html.
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
