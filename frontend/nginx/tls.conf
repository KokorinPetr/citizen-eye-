# HTTPS for Cloudflare "Full (strict)": Cloudflare Origin Certificate mounted at /etc/nginx/certs.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/civic-eye-locations.conf;
}
