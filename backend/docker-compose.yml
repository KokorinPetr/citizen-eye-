services:
  db:
    image: imresamu/postgis:17-3.5  # multi-arch build of postgis/postgis (works on Apple Silicon)
    container_name: civic-eye-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic_eye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_eye}
      POSTGRES_DB: ${POSTGRES_DB:-civic_eye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/20_create_test_db.sql:/docker-entrypoint-initdb.d/20_create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
