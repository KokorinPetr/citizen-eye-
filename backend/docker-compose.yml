services:
  db:
    image: imresamu/postgis:17-3.5  # multi-arch build of postgis/postgis (works on Apple Silicon)
    container_name: civic-eye-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-civic_eye}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civic_eye}
      POSTGRES_DB: ${POSTGRES_DB:-civic_eye}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/20_create_test_db.sql:/docker-entrypoint-initdb.d/20_create_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: civic-eye-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${API_ENVIRONMENT:-local}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-civic_eye}:${POSTGRES_PASSWORD:-civic_eye}@db:5432/${POSTGRES_DB:-civic_eye}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      # Values come from .env when it exists; the defaults are for local use only.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-docker-only-secret-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      AI_MODEL: ${AI_MODEL:-deepseek-flash}
      AI_API_KEY: ${AI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}

volumes:
  postgres_data:
